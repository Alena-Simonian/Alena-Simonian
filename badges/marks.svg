<svg xmlns="http://www.w3.org/2000/svg" width="456" height="118" viewBox="0 0 456 118" role="img" aria-label="Inference, Retrieval, Traces, Interface">
  <title>Inference, Retrieval, Traces, Interface</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221C33"/>
      <stop offset="1" stop-color="#100E18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="0.42" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Inference -->
  <g>
    <rect x="1" y="1" width="94" height="116" rx="20" fill="url(#card)" stroke="url(#rim)" stroke-width="1.5"/>
    <circle cx="48" cy="44" r="22" fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="33" y="50" width="5" height="12" rx="1.4" fill="#C4B5FD"/>
    <rect x="41" y="44" width="5" height="18" rx="1.4" fill="#C4B5FD"/>
    <rect x="49" y="34" width="5" height="28" rx="1.4" fill="#F5F3FF"/>
    <rect x="57" y="46" width="5" height="16" rx="1.4" fill="#A78BFA"/>
    <text x="48" y="98" text-anchor="middle" fill="#EDE9FE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1">INFERENCE</text>
  </g>

  <!-- Retrieval -->
  <g transform="translate(120 0)">
    <rect x="1" y="1" width="94" height="116" rx="20" fill="url(#card)" stroke="url(#rim)" stroke-width="1.5"/>
    <circle cx="48" cy="44" r="22" fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="38" cy="50" r="4.5" fill="none" stroke="#C4B5FD" stroke-width="1.6"/>
    <circle cx="60" cy="34" r="4" fill="#F5F3FF"/>
    <circle cx="58" cy="56" r="3.2" fill="none" stroke="#A78BFA" stroke-width="1.6"/>
    <path d="M42.5 47.5 L55.5 36.5 M42.2 51.2 L54.6 54.6" fill="none" stroke="#C4B5FD" stroke-width="1.4" stroke-linecap="round"/>
    <text x="48" y="98" text-anchor="middle" fill="#EDE9FE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1">RETRIEVAL</text>
  </g>

  <!-- Traces -->
  <g transform="translate(240 0)">
    <rect x="1" y="1" width="94" height="116" rx="20" fill="url(#card)" stroke="url(#rim)" stroke-width="1.5"/>
    <circle cx="48" cy="44" r="22" fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <polyline points="30,48 37,48 42,40 48,56 55,32 61,48 68,48" fill="none" stroke="#F5F3FF" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="55" cy="32" r="2.4" fill="#C4B5FD"/>
    <text x="48" y="98" text-anchor="middle" fill="#EDE9FE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6">TRACES</text>
  </g>

  <!-- Interface -->
  <g transform="translate(360 0)">
    <rect x="1" y="1" width="94" height="116" rx="20" fill="url(#card)" stroke="url(#rim)" stroke-width="1.5"/>
    <circle cx="48" cy="44" r="22" fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="32" y="32" width="32" height="24" rx="3" fill="none" stroke="#C4B5FD" stroke-width="1.5"/>
    <line x1="32" y1="38" x2="64" y2="38" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="36" cy="35.2" r="1.05" fill="#DDD6FE"/>
    <circle cx="40" cy="35.2" r="1.05" fill="#DDD6FE"/>
    <rect x="36" y="42" width="14" height="2.2" rx="1" fill="#F5F3FF"/>
    <rect x="36" y="47.2" width="22" height="2.2" rx="1" fill="#A78BFA"/>
    <text x="48" y="98" text-anchor="middle" fill="#EDE9FE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1">INTERFACE</text>
  </g>
</svg>
